#settings for database
spring.datasource.url=jdbc:mysql://localhost/ljsearch?useSSL=false&characterEncoding=UTF-8
spring.datasource.username=lj
spring.datasource.password=lj
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#turned on to enable lazy loading
#spring.jpa.properties.hibernate.enable_lazy_load_no_trans = true
#spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
#spring.jpa.hibernate.ddl-auto=update
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.datasource.hikari.maximum-pool-size=10
# no SQL in the view layer; the controllers read what they need themselves
spring.jpa.open-in-view=false
# set to false to start without the downloader (local runs, checks)
ljsearch.downloads.enabled=true
